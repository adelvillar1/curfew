  # Submitted by its parent app, so it has no plist to bootstrap. Disable-only by design: the
  # one-way-door rule forbids a bootout it could not undo (KI-033 class).
  - id: com.docker.helper
    kind: agent
    lever: disable
    supervised: launchd
    status: verified
    hazards: [vendor]
    evidence: "2026-11-25 · this Mac · disable→print-disabled says disabled; enable→enabled. No bootout: Docker's privileged helper is app-submitted and has no plist to restore from."
    stop:
      run:
        - [/bin/launchctl, disable, {domain}/com.docker.helper]
      verify:
        kind: label_not_running
        value: com.docker.helper
    start:
      run:
        - [/bin/launchctl, enable, {domain}/com.docker.helper]
    depends: []

