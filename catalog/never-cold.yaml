# Entries whose absence costs minutes, not bytes. There is nothing to suspend here: Laya is an
# in-process engine with no port and no job, and making it cold costs a three-minute reload on the
# next sys1 call. `lever: none` is legal only with a coldStartCost.

entries:
  - id: laya
    kind: inProcess
    lever: none
    supervised: none
    status: verified
    stoppable: false
    hazards: [always-on]
    evidence: "owner decision 2026-11-25: kept running so the sys1 warm-up penalty is already paid. Nothing to stop — it is an in-process engine inside sys1, so this is a decision, not a recipe."
    coldStartCost: up to 180 s on the first sys1 call after a restart
    depends: []

  # Not vendor noise: these are development tooling that a build or an agent run may need. They are
  # catalogued so the classification is explicit and testable, and marked unstoppable so no bundle
  # that acts can ever include them.
  - id: com.github.facebook.watchman
    kind: agent
    lever: none
    supervised: launchd
    status: verified
    hazards: [dev-tool]
    evidence: "2026-11-24 · this Mac · file watcher used by bundlers and test runners; stopping it breaks HMR and watch mode"
    stoppable: false
    coldStartCost: instant to start, but every in-flight watcher must re-register
    depends: []

  - id: com.ollama.ollama
    kind: agent
    lever: none
    supervised: launchd
    status: verified
    hazards: [dev-tool, socket]
    evidence: "2026-11-24 · this Mac · local model server on :11434; a cold start reloads the model into RAM"
    stoppable: false
    coldStartCost: model reload, tens of seconds
    depends: []
