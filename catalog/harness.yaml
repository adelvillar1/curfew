# The harness path. `harness-core` protects these by *port*, because a port survives a reinstall that
# renames a job.

entries:
  # Always-on by owner decision (2026-11-24). Every semantic tool in the harness depends on this
  # server; stopping it does not save the machine, it breaks the session.
  - id: com.adelvillar1.sem1-llama
    kind: agent
    lever: none
    supervised: launchd
    status: verified
    stoppable: false
    hazards: [socket, always-on]
    evidence: "owner decision 2026-11-24: must stay up — the embedding server every semantic tool depends on. Curfew does not stop it; there is no recipe to verify."
    coldStartCost: first embed call reloads embeddinggemma-2 into RAM
    depends: []

  # Built for OpenBot, but NOT redundant: the bridge is how an agent reaches the Kanzo board over
  # Tailscale (119 requests, 111 of them on 2026-11-25). Owner decision: it stays.
  - id: dev.dsh.bridge
    kind: agent
    lever: none
    supervised: launchd
    status: verified
    stoppable: false
    hazards: [socket, always-on]
    evidence: "owner decision 2026-11-25: the Kanzo bridge stays up. It is the agent path to the board — stopping it cuts that path, and there is no recipe to verify because it is not a stop target."
    coldStartCost: the board is unreachable until the bridge restarts
    depends: []
