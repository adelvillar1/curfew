# The harness path. `harness-core` protects these by *port*, because a port survives a reinstall that
# renames a job.

entries:
  # The embedding endpoint every semantic tool depends on: the harness's recall, select_skills,
  # fleet's recall and sem1 all call http://127.0.0.1:8901/v1/embeddings. Since 2026-11-25 that URL is
  # served by a local proxy forwarding to qwen3-embedding-8b at 1024 dims (the local gemma model is
  # gone). It holds no model, so it costs almost nothing — but stopping it blinds every semantic path.
  - id: com.adelvillar1.embed-proxy
    kind: agent
    lever: none
    supervised: launchd
    status: verified
    stoppable: false
    hazards: [socket, always-on]
    evidence: "owner decision 2026-11-25: the embeddings path is always on. Verified the same day — launchd job RunAtLoad+KeepAlive on :8901, /health reports qwen3-embedding-8b at 1024 dims, and the recall index rebuilt through it (248 vectors and growing, 274 requests served)"
    coldStartCost: nothing local to load; a stopped proxy degrades every recall to keyword-only
    depends: []

  # Built for OpenBot, but NOT redundant: the bridge is how an agent reaches the Kanzo board over
  # Tailscale (119 requests, 111 of them on 2026-11-25). Owner decision: it stays.
  - id: dev.dsh.bridge
    kind: agent
    lever: none
    supervised: launchd
    status: verified
    stoppable: false
    hazards: [socket, always-on]
    evidence: "owner decision 2026-11-25: the Kanzo bridge stays up. It is the agent path to the board — stopping it cuts that path, and there is no recipe to verify because it is not a stop target."
    coldStartCost: the board is unreachable until the bridge restarts
    depends: []
