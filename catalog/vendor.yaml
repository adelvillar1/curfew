        - [/bin/launchctl, disable, {domain}/us.zoom.updater.login.check]
        - [/bin/launchctl, bootout, {domain}/us.zoom.updater.login.check]
      verify:
        kind: label_not_running
        value: us.zoom.updater.login.check
    start:
      run:
        - [/bin/launchctl, enable, {domain}/us.zoom.updater.login.check]
        - [/bin/launchctl, bootstrap, {domain}, {plist}]
    depends: []

  # Disable-only. Verified reversible (enable restores it), but a bootout is not used: the plist
  # lives in ~/Library/LaunchAgents and one bootout there did not come back on the first try
  # (KI-033 — cause unverified). Disable alone is enough to stop the job running, and it cannot be
  # a one-way door.
  - id: com.google.GoogleUpdater.wake
    kind: agent
    lever: disable
    supervised: launchd
    status: verified
    hazards: [vendor]
    evidence: "2026-11-24 · this Mac · disable→print-disabled says disabled; enable→enabled. Bootout deliberately not used (KI-033)"
    stop:
      run:
        - [/bin/launchctl, disable, {domain}/com.google.GoogleUpdater.wake]
      verify:
        kind: label_not_running
        value: com.google.GoogleUpdater.wake
    start:
      run:
        - [/bin/launchctl, enable, {domain}/com.google.GoogleUpdater.wake]
    depends: []

  - id: com.valvesoftware.steamclean
    kind: agent
    lever: disable
    supervised: launchd
    status: verified
    hazards: [vendor]
    evidence: "2026-11-24 · this Mac · disable→disabled; enable→enabled. Bootout deliberately not used (KI-033)"
    stop:
      run:
        - [/bin/launchctl, disable, {domain}/com.valvesoftware.steamclean]
      verify:
        kind: label_not_running
        value: com.valvesoftware.steamclean
    start:
      run:
        - [/bin/launchctl, enable, {domain}/com.valvesoftware.steamclean]
    depends: []

