        - [/bin/launchctl, bootout, {domain}/com.microsoft.OneDriveStandaloneUpdater]
      expect: print-disabled lists the label as disabled and launchctl print no longer resolves it
      verify:
        kind: label_not_running
        value: com.microsoft.OneDriveStandaloneUpdater
    start:
      run:
        - [/bin/launchctl, enable, {domain}/com.microsoft.OneDriveStandaloneUpdater]
        - [/bin/launchctl, bootstrap, {domain}, {plist}]
      meansReady: launchctl print resolves the label and print-disabled says enabled
    depends: []
